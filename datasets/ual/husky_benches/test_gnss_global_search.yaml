# Localization with the initial pose from the state estimator, which fuses the
# u-blox GNSS (no RTK, sigma ~4 m, ~5 m off the ground truth here, and its
# altitude ~9 m off the map) while the robot stands still, in the
# geo-referenced map. No heading source: the HandsFree IMU of this robot does
# not give an absolute azimuth. That pose is too uncertain for ICP alone: LIO
# must search for it in the map around it (global search, also in heading),
# where the repeated benches and the long wall give several similar matches.
dataset: dataset.yaml

# The search (no heading) takes ~40 s on a desktop PC, and it assumes the robot
# is still meanwhile: at this rate it fits in the first ~16 s of the fragment,
# before the robot moves, even on a machine twice as slow.
bag_rate: 0.2

initial_localization:
  method: InitLocalization::FromStateEstimator
  gnss_mode: relocalize
  gnss_topic: /a200_0812/gnss/ublox
  env:
    MOLA_LO_INIT_GLOBAL_SEARCH: true
    # Enough for the GNSS bias of this dataset, and a shorter search:
    MOLA_LO_INIT_GLOBAL_SEARCH_MAX_XY: 6.0
    # The state estimator reports convergence with the uncertainty the global
    # search can handle: position sigmas up to its limit
    # (MOLA_LO_INIT_GLOBAL_SEARCH_MAX_POS_SIGMA, 5 m; without RTK, the z sigma
    # stays above 1 m) and any heading:
    MOLA_SE_CONVERGENCE_POS_SIGMA: 5.0
    MOLA_SE_CONVERGENCE_ORI_SIGMA: 180.0

expected:
  # Compared with the ground truth over the last seconds of the fragment
  # (robot still after the maneuver):
  evaluate_last_seconds: 4.0
  localized: true
  max_position_error: 0.5 # [m]
  max_yaw_error_deg: 3.0
  # The pose must come from the global search:
  log_contains: "Global search: localized"
